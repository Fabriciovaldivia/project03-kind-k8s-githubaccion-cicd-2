apiVersion: apps/v1
kind: Deployment
metadata:
  name: project03
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project03
  template:
    metadata:
      labels:
        app: project03
    spec:
      containers:
        - name: project03
          image: fabriciovaldivia/project03:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
