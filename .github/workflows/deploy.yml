name: Deploy to KIND

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/project03:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/project03:latest

      - name: Deploy to KIND cluster
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}   # Servidor con KIND
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "📁 Preparando workspace"
            mkdir -p /opt/apps
            cd /opt/apps

            echo "📦 Clonando / actualizando repositorio"
            if [ ! -d "project03-kind-k8s-githubaccion-cicd-2" ]; then
              git clone https://github.com/Fabriciovaldivia/project03-kind-k8s-githubaccion-cicd-2.git
            fi

            cd project03-kind-k8s-githubaccion-cicd-2
            git pull origin main

            echo "🐳 Actualizando imagen Docker"
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/project03:latest

            echo "☸️ Cargando imagen en KIND"
            kind load docker-image ${{ secrets.DOCKERHUB_USERNAME }}/project03:latest --name project03

            echo "🔧 Configurando kubeconfig"
            kind export kubeconfig --name project03
            kubectl config use-context kind-project03

            echo "🚀 Desplegando en Kubernetes"
            kubectl apply -f k8s/

            echo "✅ Verificando rollout"
            kubectl rollout status deployment/project03
