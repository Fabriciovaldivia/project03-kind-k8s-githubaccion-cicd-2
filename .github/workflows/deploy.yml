name: Deploy to KIND

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/project03:latest .

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/project03:latest

      - name: Deploy to KIND cluster
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}   # servidor con KINDs
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Directorio donde vivirá la app
            mkdir -p /opt/apps
            cd /opt/apps

            # Clonar repo si no existe
            if [ ! -d "project03-kind-k8s-githubaccion-cicd-2" ]; then
              git clone https://github.com/Fabriciovaldivia/project03-kind-k8s-githubaccion-cicd-2.git
            fi

            cd project03-kind-k8s-githubaccion-cicd-2
            git pull origin main

            # Actualizar imagen
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/project03:latest

            # Cargar imagen en KIND
            kind load docker-image ${{ secrets.DOCKERHUB_USERNAME }}/project03:latest --name project03

            # Desplegar en Kubernetes
            kubectl apply -f k8s/
